spring.application.name=Ejercicio5Cliente
server.port=${PORT:${SERVER_PORT:8080}}
backend.url=${BACKEND_URL:http://localhost:8081}
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Seguridad Zero-Trust, Cabeceras HTTP y Rate Limiting
security.internal-api-key=${INTERNAL_API_KEY:}
security.metrics-token=${METRICS_AUTH_TOKEN:}
security.rate-limit.enabled=${SECURITY_RATE_LIMIT_ENABLED:true}
security.rate-limit.login-max=${SECURITY_LOGIN_RATE_LIMIT:20}
security.rate-limit.web-max=${SECURITY_API_RATE_LIMIT:3000}

# Monitoreo y Observabilidad (Spring Boot Actuator + Prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS:never}
management.metrics.tags.application=${spring.application.name}
